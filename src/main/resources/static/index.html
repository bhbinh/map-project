    function heuristic(a, b) {
    return map.distance(
        L.latLng(a.lat, a.lng),
        L.latLng(b.lat, b.lng)

    function lineIntersectsPolygon(p1, p2, polygon) {
    for (let i = 0; i < polygon.length; i++) {
        let a = polygon[i];
        let b = polygon[(i + 1) % polygon.length];

        if (doIntersect(p1, p2, a, b)) {
            return true;
        }
    }
    return false;
}

function doIntersect(p1, q1, p2, q2) {
    function orientation(a, b, c) {
        let val = (b[1] - a[1]) * (c[0] - b[0]) -
                  (b[0] - a[0]) * (c[1] - b[1]);
        if (val === 0) return 0;
        return (val > 0) ? 1 : 2;
    }

    let o1 = orientation(p1, q1, p2);
    let o2 = orientation(p1, q1, q2);
    let o3 = orientation(p2, q2, p1);
    let o4 = orientation(p2, q2, q1);

    return (o1 !== o2 && o3 !== o4);
}
function aStar(start, goal, graph) {
    let open = [start];
    let came = {};

    let g = {};
    let f = {};

    Object.keys(graph).forEach(k => {
        g[k] = Infinity;
        f[k] = Infinity;
    });

    g[start.name] = 0;
    f[start.name] = heuristic(start, goal);

    while (open.length > 0) {
        open.sort((a, b) => f[a.name] - f[b.name]);
        let current = open.shift();

        if (current.name === goal.name) {
            let path = [];
            let cur = current.name;

            while (cur) {
                let node = locationLayers.find(l => l.name === cur);
                path.unshift([node.lat, node.lng]);
                cur = came[cur];
            }
            return path;
        }

        graph[current.name].forEach(nei => {
            let tentative = g[current.name] + nei.cost;

            if (tentative < g[nei.node.name]) {
                came[nei.node.name] = current.name;
                g[nei.node.name] = tentative;
                f[nei.node.name] = tentative + heuristic(nei.node, goal);

                if (!open.find(n => n.name === nei.node.name)) {
                    open.push(nei.node);
                }
            }
        });
    }

    return null;
}
    function getObstacles() {
    let obstacles = [];

    locationLayers.forEach(loc => {
        loc.polys.forEach(p => {
            if (p instanceof L.Polygon) {
                obstacles.push(p.getLatLngs()[0].map(ll => [ll.lat, ll.lng]));
            }
        });
    });

    return obstacles;
}
    const originalBuildSmartGraph = buildSmartGraph;

buildSmartGraph = function(nodes, obstacles, maxDist = 120) {

    let graph = originalBuildSmartGraph(nodes, obstacles, maxDist);

    // 👉 ép nối mạnh giữa các road nodes
    let roads = nodes.filter(n => n.code === "road");

    for (let i = 0; i < roads.length - 1; i++) {
        let a = roads[i];
        let b = roads[i + 1];

        let d = map.distance(
            L.latLng(a.lat, a.lng),
            L.latLng(b.lat, b.lng)
        );

        graph[a.name].push({ node: b, cost: d * 0.5 }); // ưu tiên
        graph[b.name].push({ node: a, cost: d * 0.5 });
    }

    return graph;
};
function findNearestRoad(node) {
    let roads = locationLayers.filter(n => n.code === "road");

    if (roads.length === 0) return null;

    let nearest = roads.reduce((min, r) => {
        let d = map.distance(
            L.latLng(node.lat, node.lng),
            L.latLng(r.lat, r.lng)
        );
        return d < min.dist ? { node: r, dist: d } : min;
    }, { node: null, dist: Infinity });

    return nearest.node;
}

    function projectToSegment(p, a, b) {
    let dx = b.lat - a.lat;
    let dy = b.lng - a.lng;

    if (dx === 0 && dy === 0) return a;

    let t = ((p.lat - a.lat) * dx + (p.lng - a.lng) * dy) / (dx*dx + dy*dy);
    t = Math.max(0, Math.min(1, t));

    return {
        lat: a.lat + t * dx,
        lng: a.lng + t * dy
    };
}
    function snapToRoadSegment(node) {
    let roads = locationLayers.filter(n => n.code === "road");

    let min = Infinity;
    let best = node;

    for (let i = 0; i < roads.length - 1; i++) {
        let proj = projectToSegment(node, roads[i], roads[i+1]);

        let d = map.distance(
            L.latLng(node.lat, node.lng),
            L.latLng(proj.lat, proj.lng)
        );

        if (d < min) {
            min = d;
            best = proj;
        }
    }

    return best;
}
    confirmRoute = function () {

    let startName = document.getElementById("startNode")?.value;
    let endName = document.getElementById("endNode")?.value;

    let s = locationLayers.find(l => l.name === startName);
    let e = locationLayers.find(l => l.name === endName);

    if (!s || !e) return alert("Không tìm thấy!");

    // clear đường cũ
    if (window.currentAStarPath)
        map.removeLayer(window.currentAStarPath);

    // tìm road gần nhất
    let sRoad = findNearestRoad(s);
    let eRoad = findNearestRoad(e);

    if (!sRoad || !eRoad) {
        alert("Không tìm thấy đường gần!");
        return;
    }
let obstacles = getObstacles();
let graph = buildSmartGraph(locationLayers, obstacles, 200);

    // chạy A*
    let path = aStar(sRoad, eRoad, graph);

    if (!path || path.length === 0) {
        alert("Không có đường!");
        return;
    }

    // nối điểm đầu cuối
    path.unshift([s.lat, s.lng]);
    path.push([e.lat, e.lng]);

    // vẽ đường
    window.currentAStarPath = L.polyline(path, {
        color: 'red',
        weight: 6
    }).addTo(map);

    map.fitBounds(window.currentAStarPath.getBounds(), { padding: [50, 50] });

    // tính khoảng cách
    let total = 0;
    for (let i = 0; i < path.length - 1; i++) {
        total += map.distance(
            L.latLng(path[i][0], path[i][1]),
            L.latLng(path[i+1][0], path[i+1][1])
        );
    }

    L.popup()
        .setLatLng(path[Math.floor(path.length / 2)])
        .setContent("Khoảng cách: <b>" + Math.round(total) + " m</b>")
        .openOn(map);
};
   function buildSmartGraph(nodes, obstacles, maxDist = 120) {

    let graph = {};
    let roads = nodes.filter(n => n.code === "road");

    roads.forEach(n => graph[n.name] = []);

    // ✅ chỉ nối node liền kề
    for (let i = 0; i < roads.length - 1; i++) {

        let a = roads[i];
        let b = roads[i + 1];

        let p1 = [a.lat, a.lng];
        let p2 = [b.lat, b.lng];

        // 🚫 check cắt polygon (tòa nhà)
        let blocked = obstacles.some(poly =>
            lineIntersectsPolygon(p1, p2, poly)
        );

        let d = map.distance(
            L.latLng(a.lat, a.lng),
            L.latLng(b.lat, b.lng)
        );

        if (!blocked && d < maxDist) {
            graph[a.name].push({ node: b, cost: d });
            graph[b.name].push({ node: a, cost: d });
        }
    }

    return graph;
}

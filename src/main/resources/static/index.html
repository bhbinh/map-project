<html>
<head>
    <meta charset="utf-8"/>
    <title>UTC & UTH Map Integration - FINAL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar">
    <div class="p-3">
        <h5>📍 Bản đồ Nội bộ</h5>
        <select id="schoolSelect" class="form-select mt-2">
            <option value="21.028184,105.803834">UTC Hà Nội</option>
            <option value="10.846391,106.794475">UTH TP.HCM</option>
        </select>
        <div class="d-flex gap-2 mt-3 pb-2"
             style="overflow-x: auto; white-space: nowrap; scrollbar-width: thin;">

            <!-- LOGIN -->
            <button onclick="openLoginUI()"
                    id="loginBtn"
                    class="btn btn-outline-primary btn-sm"
                    style="flex: 0 0 auto;">

                <i class="bi bi-person-fill"></i>
                Đăng nhập

            </button>

            <!-- LOGOUT -->
            <button onclick="logout()"
                    id="logoutBtn"
                    class="btn btn-danger btn-sm"
                    style="flex: 0 0 auto; display:none;">

                <i class="bi bi-box-arrow-right"></i>
                Logout

            </button>

            <!-- USER INFO -->
            <div id="userInfo"
                 class="badge bg-dark align-self-center"
                 style="display:none;">

            </div>

            <!-- ROUTING -->
            <button onclick="setRoutingUI()"
                    class="btn btn-success btn-sm"
                    style="flex: 0 0 auto;">

                🧭 Chỉ đường

            </button>

            <!-- SEARCH -->
            <button onclick="func1()"
                    class="btn btn-primary btn-sm"
                    style="flex: 0 0 auto;">

                🔍 Tìm kiếm

            </button>

            <!-- FILTER -->
            <button onclick="openFilterUI()"
                    class="btn btn-info btn-sm text-white"
                    style="flex: 0 0 auto;">

                <i class="bi bi-filter"></i>
                Bộ lọc

            </button>

            <!-- FAVORITE -->
            <button onclick="func2()"
                    class="btn btn-warning btn-sm"
                    style="flex: 0 0 auto;">

                ⭐ Yêu thích

            </button>

            <!-- FEEDBACK -->
            <button onclick="openFeedbackUI()"
                    class="btn btn-secondary btn-sm"
                    style="flex: 0 0 auto;">

                <i class="bi bi-chat-left-text"></i>
                Góp ý

            </button>

        </div>
    </div>
    <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 10px; background-color: #f9f9f9;">
        <div class="text-muted small text-center mt-2">Hệ thống sẵn sàng.</div>
    </div>

    <!-- KHỐI DƯỚI: Input Chat -->
    <div class="p-2 border-top">
        <div class="input-group">
            <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Hỏi AI về đường đi...">
            <button class="btn btn-primary btn-sm" onclick="sendMessage()">✈️</button>
        </div>
    </div>
</div>
<button class="toggle-btn btn btn-light" onclick="toggleSidebar()">☰</button>
<div id="map"></div>
<script src="/js/web.js"></script>
</body>
</html>
